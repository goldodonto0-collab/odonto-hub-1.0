<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Odonto Hub</title>

  <link rel="stylesheet" href="style.css">

  <!-- PDF LIB -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
</head>

<body>

<div class="container">

  <h1>Odonto Hub</h1>

  <div class="tabs">
    <button onclick="mostrarAba('pacientes')">Pacientes</button>
    <button onclick="mostrarAba('atendimentos')">Atendimentos</button>
    <button onclick="mostrarAba('calendario')">Calendário</button>
    <button onclick="mostrarAba('orcamentos')">Orçamentos</button>
  </div>

  <!-- PACIENTES -->
  <section id="pacientes" class="aba">
    <div class="card">
      <h2>Cadastro de Pacientes</h2>

      <input id="nomePaciente" placeholder="Nome">
      <input id="telefonePaciente" placeholder="Telefone">
      <input id="cpfPaciente" placeholder="CPF">
      <input id="rgPaciente" placeholder="RG">
      <input id="nascimentoPaciente" type="date">
      <input id="enderecoPaciente" placeholder="Endereço">
      <textarea id="observacoesPaciente" placeholder="Observações"></textarea>

      <button onclick="salvarPaciente()">Salvar</button>
    </div>

    <div class="card">
      <h3>Pacientes</h3>
      <ul id="listaPacientes"></ul>
    </div>
  </section>

  <!-- ORÇAMENTOS -->
  <section id="orcamentos" class="aba" style="display:none;">

    <div class="card">

      <h2>Orçamento Odontológico</h2>

      <select id="pacienteOrcamento"></select>

      <div id="odontograma" class="odontograma"></div>

      <input id="denteSelecionado" placeholder="Dente" readonly>
      <input id="procedimentoOrcamento" placeholder="Procedimento">
      <input id="valorOrcamento" type="number" placeholder="Valor">

      <button onclick="adicionarItemOrcamento()">Adicionar</button>

      <ul id="listaItensOrcamento"></ul>

      <h3>Total: R$ <span id="totalOrcamento">0.00</span></h3>

      <button onclick="salvarOrcamento()">Salvar Orçamento</button>
      <button onclick="gerarPDF()">Gerar PDF</button>

    </div>

    <div class="card">
      <h3>Histórico</h3>
      <ul id="historicoOrcamentos"></ul>
    </div>

  </section>

</div>

<script type="module" src="script.js"></script>

</body>
</html>
