<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <title>Agenda de Pacientes</title>

  <style>
    body {
      font-family: Arial;
      background: #f4f6f8;
      padding: 20px;
    }

    .container {
      max-width: 600px;
      margin: auto;
      background: white;
      padding: 20px;
      border-radius: 10px;
      box-shadow: 0 0 10px rgba(0,0,0,0.1);
    }

    h2 {
      color: #333;
    }

    input {
      width: 100%;
      padding: 10px;
      margin-bottom: 10px;
      border-radius: 5px;
      border: 1px solid #ccc;
    }

    button {
      padding: 10px;
      border: none;
      border-radius: 5px;
      background: #007bff;
      color: white;
      cursor: pointer;
    }

    button:hover {
      background: #0056b3;
    }

    ul {
      list-style: none;
      padding: 0;
    }

    li {
      background: #f9f9f9;
      margin-bottom: 10px;
      padding: 10px;
      border-radius: 5px;
    }

    strong {
      color: #007bff;
    }
  </style>

</head>

<body>

<div class="container">

<h2>Novo Registro</h2>

<input id="nome" placeholder="Nome do paciente">
<input id="feito" placeholder="O que foi feito">
<input id="proximo" placeholder="Próximo passo">

<button onclick="salvar()">Salvar</button>

<h2>Buscar paciente</h2>
<input id="busca" placeholder="Digite o nome" oninput="filtrar()">

<h2>Registros</h2>
<ul id="lista"></ul>

</div>

<script type="module" src="script.js"></script>

</body>
</html>
