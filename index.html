<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Odonto Hub</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="container">
    <h1>Odonto Hub</h1>

    <div class="tabs">
      <button onclick="mostrarAba('pacientes')">Pacientes</button>
      <button onclick="mostrarAba('atendimentos')">Atendimentos</button>
    </div>

    <!-- ABA PACIENTES -->
    <section id="pacientes" class="aba">
      <div class="card">
        <h2>Cadastro de Pacientes</h2>

        <input id="nomePaciente" type="text" placeholder="Nome do paciente">
        <input id="telefonePaciente" type="text" placeholder="Telefone">
        <input id="cpfPaciente" type="text" placeholder="CPF">
        <input id="rgPaciente" type="text" placeholder="RG">
        <input id="nascimentoPaciente" type="date">
        <input id="enderecoPaciente" type="text" placeholder="Endereço">
        <input id="saudePaciente" type="text" placeholder="Problema de saúde">
        <textarea id="observacoesPaciente" placeholder="Observações"></textarea>

        <button onclick="salvarPaciente()">Salvar Paciente</button>
      </div>

      <div class="card">
        <h3>Pacientes cadastrados</h3>
        <ul id="listaPacientes"></ul>
      </div>
    </section>

    <!-- ABA ATENDIMENTOS -->
    <section id="atendimentos" class="aba" style="display:none;">
      <div class="card">
        <h2>Novo Atendimento</h2>

        <input id="nome" type="text" placeholder="Nome do paciente">
        <input id="feito" type="text" placeholder="Procedimento realizado">
        <input id="proximo" type="text" placeholder="Próximo retorno">
        <button onclick="salvar()">Salvar Atendimento</button>
      </div>

      <div class="card">
        <h3>Buscar paciente</h3>
        <input id="busca" type="text" placeholder="Digite o nome" onkeyup="filtrar()">
      </div>

      <div class="card">
        <h3>Alertas</h3>
        <ul id="alertas"></ul>
      </div>

      <div class="card">
        <h3>Histórico de atendimentos</h3>
        <ul id="lista"></ul>
      </div>
    </section>
  </div>

  <script type="module" src="script.js"></script>
</body>
</html>
