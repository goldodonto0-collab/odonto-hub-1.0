<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Odonto Hub</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <h1>Odonto Hub</h1>

  <!-- ABAS -->
  <div class="tabs">
    <button onclick="mostrarAba('pacientes')">Pacientes</button>
    <button onclick="mostrarAba('atendimentos')">Atendimentos</button>
  </div>

  <!-- ABA PACIENTES -->
  <div id="pacientes" class="aba">
    <h2>Cadastro de Pacientes</h2>

    <input id="nomePaciente" type="text" placeholder="Nome do paciente">
    <input id="telefonePaciente" type="text" placeholder="Telefone">
    <button onclick="salvarPaciente()">Salvar Paciente</button>

    <h3>Pacientes cadastrados</h3>
    <ul id="listaPacientes"></ul>
  </div>

  <!-- ABA ATENDIMENTOS -->
  <div id="atendimentos" class="aba" style="display:none;">
    <h2>Atendimentos</h2>

    <input id="nome" type="text" placeholder="Nome do paciente">
    <input id="feito" type="text" placeholder="Procedimento realizado">
    <input id="proximo" type="text" placeholder="Próximo retorno">
    <button onclick="salvar()">Salvar Atendimento</button>

    <h3>Buscar paciente</h3>
    <input id="busca" type="text" placeholder="Digite o nome" onkeyup="filtrar()">

    <h3>Alertas</h3>
    <ul id="alertas"></ul>

    <h3>Histórico</h3>
    <ul id="lista"></ul>
  </div>

  <script type="module" src="script.js"></script>
</body>
</html>
