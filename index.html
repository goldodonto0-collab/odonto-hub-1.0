<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Odonto Hub</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="container">

  <h1>Odonto Hub</h1>

  <div class="tabs">
    <button onclick="mostrarAba('pacientes')">Pacientes</button>
    <button onclick="mostrarAba('atendimentos')">Atendimentos</button>
    <button onclick="mostrarAba('calendario')">Calendário</button>
  </div>

  <!-- PACIENTES -->
  <section id="pacientes" class="aba">

    <div class="card">
      <h2>Cadastro de Pacientes</h2>

      <input id="nomePaciente" placeholder="Nome">
      <input id="telefonePaciente" placeholder="Telefone">
      <input id="cpfPaciente" placeholder="CPF">
      <input id="rgPaciente" placeholder="RG">
      <input id="nascimentoPaciente" type="date">
      <input id="enderecoPaciente" placeholder="Endereço">
      <textarea id="observacoesPaciente" placeholder="Observações"></textarea>

      <button onclick="salvarPaciente()">Salvar</button>
    </div>

    <div class="card">
      <h3>Pacientes</h3>
      <ul id="listaPacientes"></ul>
    </div>

  </section>

  <!-- ATENDIMENTOS -->
  <section id="atendimentos" class="aba" style="display:none;">

    <div class="card">
      <h2>Novo Atendimento</h2>

      <select id="nome"></select>

      <input id="feito" placeholder="Procedimento">
      <input id="proximo" placeholder="Retorno">

      <button onclick="salvarAtendimento()">Salvar</button>
    </div>

    <div class="card">
      <h3>Histórico</h3>
      <ul id="listaAtendimentos"></ul>
    </div>

  </section>

  <!-- CALENDÁRIO -->
  <section id="calendario" class="aba" style="display:none;">

    <div class="card">
      <h2>Novo Agendamento</h2>

      <select id="nomeAgenda"></select>

      <input type="date" id="dataAgendamento">
      <input id="descricaoAgendamento" placeholder="Descrição">

      <button onclick="salvarAgendamento()">Salvar</button>
    </div>

    <div class="card">
      <h3>Agenda</h3>
      <ul id="listaCalendario"></ul>
    </div>

  </section>

</div>

<script type="module" src="script.js"></script>

</body>
</html>
