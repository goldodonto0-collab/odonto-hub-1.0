<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Odonto Hub</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="container">
    <h1>Odonto Hub</h1>

    <!-- MENU -->
    <div class="tabs">
      <button type="button" onclick="mostrarAba('pacientes')">Pacientes</button>
      <button type="button" onclick="mostrarAba('atendimentos')">Atendimentos</button>
      <button type="button" onclick="mostrarAba('calendario')">Calendário</button>
      <button type="button" onclick="mostrarAba('orcamentos')">Orçamentos</button>
    </div>

    <!-- PACIENTES -->
    <section id="pacientes" class="aba">
      <div class="card">
        <h2>Cadastro de Pacientes</h2>

        <input id="nomePaciente" type="text" placeholder="Nome do paciente">
        <input id="telefonePaciente" type="text" placeholder="Telefone">
        <input id="cpfPaciente" type="text" placeholder="CPF">
        <input id="rgPaciente" type="text" placeholder="RG">
        <input id="nascimentoPaciente" type="date">
        <input id="enderecoPaciente" type="text" placeholder="Endereço">
        <input id="saudePaciente" type="text" placeholder="Problema de saúde">
        <textarea id="observacoesPaciente" placeholder="Observações"></textarea>

        <button type="button" onclick="salvarPaciente()">Salvar Paciente</button>
      </div>

      <div class="card">
        <h3>Pacientes cadastrados</h3>
        <ul id="listaPacientes"></ul>
      </div>
    </section>

    <!-- ATENDIMENTOS -->
    <section id="atendimentos" class="aba" style="display:none;">
      <div class="card">
        <h2>Novo Atendimento</h2>

        <select id="nome">
          <option value="">Selecione o paciente</option>
        </select>

        <input id="feito" type="text" placeholder="Procedimento realizado">
        <input id="proximo" type="text" placeholder="Próximo retorno">

        <button type="button" onclick="salvar()">Salvar Atendimento</button>
      </div>

      <div class="card">
        <h3>Histórico de atendimentos</h3>
        <ul id="lista"></ul>
      </div>
    </section>

    <!-- CALENDÁRIO -->
    <section id="calendario" class="aba" style="display:none;">
      <div class="card">
        <h2>Calendário de Retornos</h2>
        <ul id="listaCalendario"></ul>
      </div>
    </section>

    <!-- ORÇAMENTOS -->
    <section id="orcamentos" class="aba" style="display:none;">
      <div class="card">
        <h2>Orçamento Odontológico</h2>

        <!-- PACIENTE -->
        <select id="pacienteOrcamento">
          <option value="">Selecione o paciente</option>
        </select>

        <!-- ODONTOGRAMA -->
        <div id="odontograma" class="odontograma"></div>

        <!-- CAMPOS -->
        <input id="denteSelecionado" type="text" placeholder="Dente" readonly>
        <input id="procedimentoOrcamento" type="text" placeholder="Procedimento">
        <input id="valorOrcamento" type="number" placeholder="Valor">

        <button type="button" onclick="adicionarItemOrcamento()">Adicionar</button>

        <ul id="listaItensOrcamento"></ul>

        <h3>Total: R$ <span id="totalOrcamento">0.00</span></h3>

        <button type="button" onclick="salvarOrcamento()">Salvar Orçamento</button>
      </div>

      <div class="card">
        <h3>Histórico de Orçamentos</h3>
        <ul id="historicoOrcamentos"></ul>
      </div>
    </section>

  </div>

  <!-- MODAL -->
  <div id="modalFicha" class="modal" style="display:none;">
    <div class="modal-conteudo">
      <span class="fechar" onclick="fecharFicha()">×</span>
      <div id="conteudoFicha"></div>
    </div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
  <script type="module" src="script.js"></script>

</body>
</html>
